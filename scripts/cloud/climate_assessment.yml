# Climate assessment (MAGICC + RIME degree days) for OPEN-PROM, run in the cloud.
#
# Copy this file to .github/workflows/climate_assessment.yml of the repository
# that runs it. MAGICC, its probabilistic file, the AR6 infiller database and
# (optional) RIME data are downloaded at run time from a secret link (repository
# secret CLIMATE_ASSETS_URL: a .zip or .tar.gz laid out as in `env` below, e.g. an
# "anyone with the link" OneDrive share). They are never cached or uploaded.
# Logs, inputs and outputs of a run are visible to whoever can see the repository.
#
# Started from a user's machine by scripts/tools/runClimateCloud.R (VS Code task
# "RUN CLIMATE EMULATOR (CLOUD)"). The emissions file is sent as a compressed input,
# never committed. The script downloads the outputs and then deletes the run.
# See tutorial 13, section 7.

name: climate_assessment
run-name: "climate ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      emissions_b64:
        description: "emissions.csv, zlib/gzip-compressed and base64-encoded (sent by runClimateCloud.R)"
        required: true
      request_id:
        description: "Random id used by the caller to find this run"
        required: true
      num_cfgs:
        description: "MAGICC configurations (600 = full ensemble, 50 = quick test)"
        default: "600"
      degree_days:
        description: "Also compute RIME degree-day ratios (true/false)"
        default: "true"
      ssp:
        description: "SSP for the RIME lookup"
        default: "SSP2"
      openprom_ref:
        description: "OPEN-PROM branch/tag providing the helper scripts"
        default: "main"

permissions:
  contents: read

env:
  OPENPROM_REPO: e3modelling/OPEN-PROM
  CLIMATE_ASSESSMENT_VERSION: "v0.1.6"
  MAGICC_VERSION: "v7.5.3"
  # Layout of the assets archive (extracted to ./assets)
  ASSET_MAGICC_EXE: assets/magicc/bin/magicc
  ASSET_MAGICC_PROB: assets/magicc/0fd0f62-derived-metrics-id-f023edb-drawnset.json
  ASSET_INFILLER: assets/infiller/1652361598937-ar6_emissions_vetted_infillerdatabase_10.5281-zenodo.6390768.csv
  ASSET_RIME_CDD: assets/rime/sdd_c_18p3_COUNTRIES.nc
  ASSET_RIME_REGIONMAP: assets/rime/regionmappingOPDEV5.csv
  RIME_CDD_VARIABLE: "sdd_c_18p3|Hazard|Absolute|Population weighted"

jobs:
  climate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Download climate assets (secret link)
        env:
          ASSETS_URL: ${{ secrets.CLIMATE_ASSETS_URL }}
        run: |
          if [ -z "$ASSETS_URL" ]; then
            echo "::error::Set the repository secret CLIMATE_ASSETS_URL (tutorial 13, section 7)."; exit 1
          fi
          # OneDrive/SharePoint "anyone with the link" shares need download=1 for the raw file
          case "$ASSETS_URL" in *download=1*) url="$ASSETS_URL" ;; *\?*) url="$ASSETS_URL&download=1" ;; *) url="$ASSETS_URL?download=1" ;; esac
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/assets.bin" "$url" || { echo "::error::Download of climate assets failed"; exit 1; }
          mkdir -p assets
          case "$(file -b "$RUNNER_TEMP/assets.bin")" in
            Zip*)  unzip -q "$RUNNER_TEMP/assets.bin" -d assets ;;
            gzip*) tar -xzf "$RUNNER_TEMP/assets.bin" -C assets ;;
            *) echo "::error::The link did not return a .zip or .tar.gz (got: $(file -b "$RUNNER_TEMP/assets.bin" | cut -c1-60)). Is it an 'anyone with the link' share?"; exit 1 ;;
          esac
          rm -f "$RUNNER_TEMP/assets.bin"
          # Accept an archive with one top-level folder around magicc/, infiller/, rime/
          if [ ! -d assets/magicc ] && [ "$(ls assets | wc -l)" = 1 ]; then
            top="assets/$(ls assets)"; mv "$top"/* assets/ && rmdir "$top"
          fi

      - name: Checkout OPEN-PROM helper scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPENPROM_REPO }}
          ref: ${{ inputs.openprom_ref }}
          path: openprom
          sparse-checkout: |
            scripts/tools
            core/sets.gms
          sparse-checkout-cone-mode: false

      - name: Decode emissions
        env:
          EMISSIONS_B64: ${{ inputs.emissions_b64 }}
        run: |
          mkdir -p out
          python3 -c "import base64, os, zlib; open('out/emissions.csv', 'wb').write(zlib.decompress(base64.b64decode(os.environ['EMISSIONS_B64']), 47))"
          echo "emissions.csv: $(wc -l < out/emissions.csv) lines"

      - name: Prepare assets
        run: |
          # Large files may be stored gzipped
          for f in "$ASSET_INFILLER" "$ASSET_RIME_CDD"; do
            if [ ! -f "$f" ] && [ -f "$f.gz" ]; then gunzip -k "$f.gz"; fi
          done
          for f in "$ASSET_MAGICC_EXE" "$ASSET_MAGICC_PROB" "$ASSET_INFILLER"; do
            [ -f "$f" ] || { echo "::error::Missing in the assets archive: ${f#assets/}"; exit 1; }
          done
          chmod +x "$ASSET_MAGICC_EXE"
          sudo apt-get update -qq && sudo apt-get install -y -qq libgfortran5 > /dev/null

      - name: Set up Python
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore climate-assessment environment
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: |
            .climate-venv
            climate-assessment
          # exact Python version in the key: the venv links to the runner's interpreter
          key: climate-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ env.CLIMATE_ASSESSMENT_VERSION }}-v1

      - name: Install climate-assessment
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$CLIMATE_ASSESSMENT_VERSION" https://github.com/iiasa/climate-assessment.git
          python -m venv .climate-venv
          .climate-venv/bin/pip install --quiet --upgrade pip
          .climate-venv/bin/pip install --quiet ./climate-assessment "xarray<2023.12.0" netCDF4 openpyxl matplotlib

      - name: Run MAGICC
        env:
          NUM_CFGS: ${{ inputs.num_cfgs }}
        run: |
          case "$NUM_CFGS" in ''|*[!0-9]*) echo "::error::num_cfgs must be a number"; exit 1;; esac
          export MAGICC_EXECUTABLE_7="$PWD/$ASSET_MAGICC_EXE"
          export MAGICC_WORKER_NUMBER="$(nproc)"
          export MAGICC_WORKER_ROOT_DIR="$RUNNER_TEMP/magicc-workers"
          mkdir -p "$MAGICC_WORKER_ROOT_DIR"
          .climate-venv/bin/python climate-assessment/scripts/run_workflow.py \
            "$PWD/out/emissions.csv" "$PWD/out" \
            --model magicc \
            --model-version "$MAGICC_VERSION" \
            --num-cfgs "$NUM_CFGS" \
            --probabilistic-file "$PWD/$ASSET_MAGICC_PROB" \
            --infilling-database "$PWD/$ASSET_INFILLER"
          test -f out/emissions_alloutput.xlsx || { echo "::error::MAGICC output missing"; exit 1; }

      - name: Plot temperature
        run: .climate-venv/bin/python openprom/scripts/tools/plotGsat.py out/emissions_alloutput.xlsx out/Global_Mean_Temperature.png

      - name: RIME degree days
        if: inputs.degree_days == 'true'
        env:
          SSP: ${{ inputs.ssp }}
        run: |
          if [ ! -f "$ASSET_RIME_CDD" ]; then
            echo "::warning::No RIME dataset at ${ASSET_RIME_CDD#assets/}; degree-day step skipped."
            exit 0
          fi
          map_args=()
          [ -f "$ASSET_RIME_REGIONMAP" ] && map_args=(--regionmapping "$ASSET_RIME_REGIONMAP")
          .climate-venv/bin/python openprom/scripts/tools/rimeDegreeDays.py \
            --gsat out/emissions_alloutput.xlsx \
            --cdd-file "$ASSET_RIME_CDD" --cdd-var "$RIME_CDD_VARIABLE" \
            --ssp "$SSP" --sets openprom/core/sets.gms "${map_args[@]}" \
            --out out/iClimDegDays.csv

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climate-assessment
          path: out/
          if-no-files-found: warn
          retention-days: 1
